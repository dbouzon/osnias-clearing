name: Package COORD zip
on:
  push:
    branches: [main]
    paths: ['coord/**', '.github/workflows/coord-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'archive versionnee (sources v1.0 a v1.5 + Specification 1.0)
        run: zip -r coord-v1.0-v1.5.zip coord/
      - name: Preserver l'ancien lien (copie figee de compatibilite)
        run: cp coord-v1.0-v1.5.zip coord-v1.0-v1.4.zip
      - name: Publier les archives sur le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coord-v1.0-v1.5.zip coord-v1.0-v1.4.zip
          if git diff --cached --quiet; then echo "Archives inchangees"; exit 0; fi
          git commit -m "Rebuild COORD archive (coord-v1.0-v1.5.zip)"
          git push
